# postgres TCP service (port 5432) in dataspace — second target for the L4
# identity-isolation demo (plan 09). Named port "tcp-postgres" keeps Istio in L4 mode.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: dataspace
type: Opaque
stringData:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: app
  POSTGRES_DB: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: dataspace
  labels:
    app: postgres
spec:
  replicas: 2
  # Recreate avoids the rolling-update deadlock where old pods occupy both nodes
  # and a new node-spread pod can't schedule.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # spread replicas across nodes; each replica is an independent demo endpoint
      # (own emptyDir), which is fine for the L4 identity-isolation demo.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: postgres } }
      containers:
        - name: postgres
          image: postgres:17-alpine
          envFrom:
            - secretRef: { name: postgres }
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "app"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dataspace
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: tcp-postgres
      port: 5432
      targetPort: 5432
