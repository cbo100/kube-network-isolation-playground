# redis TCP service (port 6379) in dataspace — target for the L4 identity-isolation
# demo (plan 09). ztunnel enforces AuthorizationPolicy on raw TCP; no waypoint needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: dataspace
  labels:
    app: redis
spec:
  replicas: 2
  # Recreate avoids the rolling-update deadlock where old pods occupy both nodes
  # and a new node-spread pod can't schedule; fine for a stateless demo endpoint.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # spread replicas across nodes so requests land on more than one node
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: redis } }
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: dataspace
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: 6379
