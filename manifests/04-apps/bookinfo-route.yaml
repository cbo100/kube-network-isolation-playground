# Expose bookinfo's productpage through the kgateway ingress (localhost:9090) at
# host bookinfo.localhost. Cross-namespace routing (Gateway in kgateway-system ->
# Service in bookinfo) requires a ReferenceGrant in the bookinfo namespace.
#
# NOTE: plan 05's default-deny AuthorizationPolicy will block this until an explicit
# ALLOW for the ingress identity exists; plan 10 replaces this with an OIDC-protected
# route + waypoint. This plain route is for pre-auth smoke-testing from the browser.
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-kgateway-routes
  namespace: bookinfo
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kgateway-system
  to:
    - group: ""
      kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookinfo
  namespace: kgateway-system
spec:
  parentRefs:
    - name: http
  hostnames: ["bookinfo.localhost"]
  rules:
    - backendRefs:
        - name: productpage
          namespace: bookinfo
          port: 9080
