# =============================================================================
# ServiceEntries: declare the THREE approved external services, routed via the waypoint
# =============================================================================
# WHY ServiceEntry + `istio.io/use-waypoint`
#   ztunnel only routes EXTERNAL traffic through the egress waypoint for hosts the mesh
#   knows about. Each ServiceEntry registers an external host as a mesh service, and the
#   `istio.io/use-waypoint: egress-wp` label pins that service's egress to our waypoint so
#   the waypoint's AuthorizationPolicies apply to it.
#
# THREE SERVICES (to demonstrate a per-service access matrix):
#   1. tcpbin.com:4242   raw TCP echo   — trusted may reach
#   2. example.com:443   HTTPS          — trusted may reach
#   3. en.wikipedia.org:443 HTTPS       — untrusted may reach
#
# CRITICAL SCOPING FACT (verified empirically):
#   Egress authz is per-TARGET allow-list. A ServiceEntry that has NO AuthorizationPolicy
#   targeting it is OPEN TO EVERYONE (there is no automatic default-deny per ServiceEntry).
#   Therefore EVERY declared service below MUST have a matching ServiceEntry-targeted
#   AuthorizationPolicy (see authorizationpolicies.yaml) — otherwise it is wide open. Do not
#   add a ServiceEntry here without also adding its allow policy.
#
# resolution: DNS   — ztunnel resolves the public hostname to real IPs at connect time.
# location: MESH_EXTERNAL — outside the mesh (no mTLS to the destination).
# =============================================================================
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: tcpbin-echo
  namespace: clientspace
  labels:
    istio.io/use-waypoint: egress-wp
spec:
  hosts: ["tcpbin.com"]
  ports:
    - { number: 4242, name: tcp-echo, protocol: TCP }   # opaque L4 stream
  resolution: DNS
  location: MESH_EXTERNAL
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: example-com
  namespace: clientspace
  labels:
    istio.io/use-waypoint: egress-wp
spec:
  hosts: ["example.com"]
  ports:
    - { number: 443, name: tls-https, protocol: TLS }   # match SNI/host, don't terminate
  resolution: DNS
  location: MESH_EXTERNAL
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: wikipedia
  namespace: clientspace
  labels:
    istio.io/use-waypoint: egress-wp
spec:
  hosts: ["en.wikipedia.org"]
  ports:
    - { number: 443, name: tls-https, protocol: TLS }
  resolution: DNS
  location: MESH_EXTERNAL
