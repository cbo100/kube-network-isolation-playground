# =============================================================================
# Egress authorization on the waypoint — allow ONLY the trusted identity outbound
# =============================================================================
# WHY ON THE WAYPOINT (targetRefs -> the egress-wp Gateway)
#   The waypoint is the enforcement point for egress to declared external services. An
#   AuthorizationPolicy attached to it (via targetRefs) governs every request that ztunnel
#   routes THROUGH the waypoint — i.e. traffic to tcpbin.com:4242 and example.com:443.
#
# WHAT IT DOES
#   action: ALLOW with a single rule permitting source principal
#   cluster.local/ns/clientspace/sa/trusted-client. Because an ALLOW policy exists on the
#   waypoint, the waypoint becomes default-deny for everything it handles EXCEPT what is
#   explicitly allowed. Net effect:
#     - trusted   (SA trusted-client)   -> reaches tcpbin + example.com
#     - untrusted (SA untrusted-client) -> denied (connection reset / TLS EOF)
#     - netshoot  (SA default)          -> denied
#
# WHY THIS IS STRONGER THAN IP/NETWORK EGRESS RULES
#   The match is on the source workload's cryptographic SPIFFE identity (from STRICT mTLS,
#   plan 05), evaluated at the waypoint. It cannot be spoofed by changing pod IP, namespace
#   label, or headers — unlike NetworkPolicy egress (IP-based) which, in any case, does not
#   work for external traffic under ambient (ztunnel is the egress actor).
#
# SCOPE REMINDER
#   This only governs DECLARED external services (those routed through the waypoint by a
#   ServiceEntry). Undeclared hosts bypass the waypoint and are not controlled here.
# =============================================================================
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: egress-allow-trusted
  namespace: clientspace
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: egress-wp
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/clientspace/sa/trusted-client"
