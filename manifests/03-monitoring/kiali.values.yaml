# Helm values for kiali-server (chart 2.31.0), applied by scripts/03-monitoring.sh.
# Kiali reads Istio mesh config + queries Prometheus (from kube-prometheus-stack).
auth:
  strategy: anonymous            # local demo only; no login

deployment:
  namespace: istio-system

server:
  # Served at the root of kiali.localhost through the kgateway ingress.
  web_root: /

external_services:
  prometheus:
    # In-cluster Prometheus service created by kube-prometheus-stack in `monitoring`.
    url: "http://monitoring-kube-prometheus-prometheus.monitoring:9090"
  grafana:
    enabled: true
    internal_url: "http://monitoring-grafana.monitoring:80"
