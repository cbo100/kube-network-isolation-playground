# Expose the monitoring UIs through the kgateway ingress (localhost:9090) using
# host-based HTTPRoutes:
#   grafana.localhost, prometheus.localhost, alertmanager.localhost -> monitoring ns
#   kiali.localhost                                                  -> istio-system ns
# Cross-namespace routing (Gateway in kgateway-system -> backend Services elsewhere)
# requires a ReferenceGrant in each backend namespace.
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-kgateway-routes
  namespace: monitoring
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kgateway-system
  to:
    - group: ""
      kind: Service
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-kgateway-routes
  namespace: istio-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kgateway-system
  to:
    - group: ""
      kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: kgateway-system
spec:
  parentRefs:
    - name: http
  hostnames: ["grafana.localhost"]
  rules:
    - backendRefs:
        - name: monitoring-grafana
          namespace: monitoring
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: kgateway-system
spec:
  parentRefs:
    - name: http
  hostnames: ["prometheus.localhost"]
  rules:
    - backendRefs:
        - name: monitoring-kube-prometheus-prometheus
          namespace: monitoring
          port: 9090
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: kgateway-system
spec:
  parentRefs:
    - name: http
  hostnames: ["alertmanager.localhost"]
  rules:
    - backendRefs:
        - name: monitoring-kube-prometheus-alertmanager
          namespace: monitoring
          port: 9093
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kiali
  namespace: kgateway-system
spec:
  parentRefs:
    - name: http
  hostnames: ["kiali.localhost"]
  rules:
    - backendRefs:
        - name: kiali
          namespace: istio-system
          port: 20001
